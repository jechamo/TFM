name: Publicar slides

# Publica la carpeta slides/ en GitHub Pages. Requiere activar una vez
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main, claude/wonderful-mayer-8d0vkf]
    paths: ["slides/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides
      - id: deployment
        uses: actions/deploy-pages@v4
